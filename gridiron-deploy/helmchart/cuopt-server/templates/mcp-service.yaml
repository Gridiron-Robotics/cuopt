{{- if .Values.mcp.enabled }}
# This is what makes http://cuopt-mcp:8090 resolve in-cluster exactly as it does
# in docker-compose. The name is NOT release-prefixed on purpose: langgraph-agents
# already holds the literal host `cuopt-mcp` for the `gpu_solver` server.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.mcp.fullnameOverride }}
  labels:
    {{- include "cuopt-server.mcp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.mcp.service.type }}
  ports:
    - port: {{ .Values.mcp.service.port }}
      targetPort: {{ .Values.mcp.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "cuopt-server.mcp.selectorLabels" . | nindent 4 }}
{{- end }}
